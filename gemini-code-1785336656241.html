<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Storyboard: Purpose of Life</title>
  <!-- Google Fonts for Cinematic Visual Novel Styling -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 50% 20%, #1a1b26 0%, #0d0e15 100%);
      color: #f0f0f2;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      align-items: center;
    }

    #game {
      width: 100%;
      max-width: 740px;
      background: rgba(25, 27, 38, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 28px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      position: relative;
    }

    /* Storyboard Frame Banner */
    #storyboard-frame-container {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      background: #000;
    }

    #storyboard-img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* Top Cinematic Dialogue Box */
    #top-dialogue-box {
      background: rgba(18, 19, 26, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-left: 6px solid #f59e0b;
      min-height: 105px;
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }
    
    #top-dialogue-box.maury-theme {
      border-left-color: #f59e0b;
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.15);
    }
    
    #top-dialogue-box.marty-theme {
      border-left-color: #3b82f6;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.15);
    }

    #speaker-tag {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 1px;
      margin-bottom: 8px;
      display: block;
    }
    .maury-text { color: #fbbf24; }
    .marty-text { color: #60a5fa; }
    
    #dialogue-text {
      font-size: 1.08rem;
      line-height: 1.6;
      color: #e2e8f0;
      font-weight: 400;
    }

    /* Stage Layout & Keyframe Pulsing */
    #stage {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    
    .char-card {
      background: rgba(30, 32, 48, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      filter: brightness(0.4) grayscale(50%);
      transform: scale(0.96);
    }
    
    /* Dynamic Active Speaker Spotlight & Breath Animation */
    .char-card[data-char="maury"].active {
      filter: brightness(1) grayscale(0%);
      transform: scale(1.02);
      border-color: #f59e0b;
      background: radial-gradient(circle at 50% 30%, rgba(245, 158, 11, 0.15) 0%, rgba(30, 32, 48, 0.6) 100%);
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.25);
      animation: pulseMaury 3s ease-in-out infinite alternate;
    }
    
    .char-card[data-char="marty"].active {
      filter: brightness(1) grayscale(0%);
      transform: scale(1.02);
      border-color: #3b82f6;
      background: radial-gradient(circle at 50% 30%, rgba(59, 130, 246, 0.15) 0%, rgba(30, 32, 48, 0.6) 100%);
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.25);
      animation: pulseMarty 3s ease-in-out infinite alternate;
    }

    @keyframes pulseMaury {
      0% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.2); border-color: #f59e0b; }
      100% { box-shadow: 0 0 35px rgba(245, 158, 11, 0.4); border-color: #fcd34d; }
    }

    @keyframes pulseMarty {
      0% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.2); border-color: #3b82f6; }
      100% { box-shadow: 0 0 35px rgba(59, 130, 246, 0.4); border-color: #93c5fd; }
    }

    .avatar-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 14px;
    }
    
    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      border: 3px solid rgba(255, 255, 255, 0.2);
      transition: border-color 0.3s ease;
    }
    
    .char-card[data-char="maury"].active .avatar { border-color: #f59e0b; }
    .char-card[data-char="marty"].active .avatar { border-color: #3b82f6; }

    .char-name {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }
    .char-role {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    
    .status-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .char-card[data-char="maury"].active .status-badge { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border-color: rgba(245, 158, 11, 0.3); }
    .char-card[data-char="marty"].active .status-badge { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border-color: rgba(59, 130, 246, 0.3); }

    /* Instruction Banner */
    #instruction-banner {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.08);
      border: 1px solid rgba(251, 191, 36, 0.2);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
      transition: all 0.3s ease;
    }

    /* Progress Meter Section */
    #meter-container { position: relative; margin-bottom: 24px; }
    .meter-section {
      background: rgba(18, 19, 26, 0.5);
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .meter-labels { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; margin-bottom: 8px; }
    .label-left { color: #f87171; }
    .label-right { color: #34d399; }
    
    #meter-track { width: 100%; background: #0f1016; height: 12px; border-radius: 6px; overflow: hidden; position: relative; }
    #meter-fill { height: 100%; width: 50%; background: #f59e0b; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.5s ease; }
    #meter-center-marker { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: #ffffff; z-index: 2; transform: translateX(-50%); opacity: 0.6; }

    /* Upward Trajectory Floating Cue */
    .floating-cue {
      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      font-weight: 800;
      font-size: 1.05rem;
      padding: 6px 18px;
      border-radius: 20px;
      pointer-events: none;
      animation: floatUpTrajectory 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      z-index: 30;
    }
    .cue-positive { background: rgba(16, 185, 129, 0.95); color: #fff; box-shadow: 0 0 20px rgba(16, 185, 129, 0.6); }
    .cue-negative { background: rgba(239, 68, 68, 0.95); color: #fff; box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); }

    @keyframes floatUpTrajectory {
      0% { opacity: 0; transform: translate(-50%, 40px) scale(0.9); }
      25% { opacity: 1; transform: translate(-50%, -10px) scale(1.05); }
      75% { opacity: 1; transform: translate(-50%, -90px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -130px) scale(0.95); }
    }

    /* Choice Options Staggered Cards */
    #choice-area-header {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-bottom: 12px;
      text-align: left;
    }
    #choices { display: flex; flex-direction: column; gap: 12px; position: relative; }
    
    .choice-btn {
      width: 100%;
      padding: 16px 18px;
      background: rgba(30, 32, 48, 0.5);
      backdrop-filter: blur(8px);
      color: #f1f5f9;
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      font-size: 0.98rem;
      font-weight: 500;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      animation: slideInCard 0.4s ease forwards;
    }
    
    @keyframes slideInCard {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .choice-btn.maury-btn:hover {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.12);
      transform: translateX(6px);
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.15);
    }
    
    .choice-btn.marty-btn:hover {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.12);
      transform: translateX(6px);
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.15);
    }

    .choice-tag {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      margin-left: 12px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .tag-calm { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .tag-tense { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

    .btn-arrow { font-size: 1.2rem; margin-left: 8px; color: #64748b; transition: transform 0.2s; }
    .choice-btn:hover .btn-arrow { transform: translateX(3px); color: #fff; }

    /* Endings & Reset */
    #reset-btn {
      width: 100%;
      padding: 14px;
      background: #dc2626;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 20px;
      display: none;
      transition: background 0.2s;
    }
    #reset-btn:hover { background: #b91c1c; }
  </style>
</head>
<body>

<div id="game">

  <!-- Top Cinematic Dialogue Box -->
  <div id="top-dialogue-box" class="maury-theme">
    <span id="speaker-tag" class="maury-text">Maury Ornest</span>
    <span id="dialogue-text">Choose how Maury initiates the argument on what gives life true purpose.</span>
  </div>

  <!-- Storyboard Panel Image Banner (Above Characters) -->
  <div id="storyboard-frame-container">
    <img id="storyboard-img" src="input_file_0.png" alt="The Doctor's Portrait Storyboard Panel">
  </div>

  <!-- Character Stage -->
  <div id="stage">
    <div id="card-maury" class="char-card active" data-char="maury">
      <div class="avatar-wrapper">
        <div id="avatar-maury" class="avatar"></div>
      </div>
      <div class="char-name">Maury Ornest</div>
      <div class="char-role">Action & Ambition</div>
      <span id="badge-maury" class="status-badge">[Calm]</span>
    </div>

    <div id="card-marty" class="char-card" data-char="marty">
      <div class="avatar-wrapper">
        <div id="avatar-marty" class="avatar"></div>
      </div>
      <div class="char-name">Marty Welsh</div>
      <div class="char-role">Presence & Acceptance</div>
      <span id="badge-marty" class="status-badge">[Waiting]</span>
    </div>
  </div>

  <!-- Instruction Banner -->
  <div id="instruction-banner">👇 Choose Maury's response</div>

  <!-- Meter Container -->
  <div id="meter-container">
    <div class="meter-section">
      <div class="meter-labels">
        <span class="label-left">💥 0% (Breakdown)</span>
        <span id="meter-status" style="color: #f59e0b;">Progress: 50%</span>
        <span class="label-right">🤝 100% (Resolution)</span>
      </div>
      <div id="meter-track">
        <div id="meter-center-marker"></div>
        <div id="meter-fill"></div>
      </div>
    </div>
  </div>

  <!-- Choice Area -->
  <div id="choice-area">
    <div id="choice-area-header">Select Maury's Statement:</div>
    <div id="choices"></div>
  </div>

  <button id="reset-btn" onclick="resetGame()">Start Storyboard Over</button>

</div>

<script>
  let resolutionProgress = 50; // Scale 0 (Breakdown) to 100 (Resolution)
  let currentTurn = 'maury';
  let typewriterTimeout = null;

  const charImages = {
    maury: "http://googleusercontent.com/image_collection/image_retrieval/17351369744330929295_0",
    marty: "http://googleusercontent.com/image_collection/image_retrieval/1250294224656821907_0"
  };

  const dialogueTree = {
    maury: [
      {
        label: "Push for Legacy: 'Purpose comes from building something lasting.'",
        text: "If you aren't fighting to leave something behind—an achievement, a mark—then what was the point of your time here?",
        progressDelta: -20,
        type: "tense",
        tag: "⚡ Escalates Conflict",
        responseOptions: ["marty_accept", "marty_pushback"]
      },
      {
        label: "Seek Common Ground: 'Maybe purpose changes as we age.'",
        text: "Perhaps what I pushed for in youth isn't the only way to measure a life. What did it feel like for you when priorities shifted?",
        progressDelta: 20,
        type: "calm",
        tag: "🕊️ Builds Empathy",
        responseOptions: ["marty_peace", "marty_accept"]
      }
    ],
    marty: [
      {
        label: "Advocate Presence: 'Purpose is just fully experiencing the moment.'",
        text: "When everything is stripped away, you realize purpose isn't a grand finish line. It's just being here, fully present, while you have the breath.",
        progressDelta: 15,
        type: "calm",
        tag: "🕊️ Builds Empathy",
        responseOptions: ["maury_doubt", "maury_push"]
      },
      {
        label: "Challenge Ambition: 'Obsessing over legacy steals the present.'",
        text: "Chasing a legacy is just fear of being forgotten. It keeps you from actually living the hours you are given.",
        progressDelta: -25,
        type: "tense",
        tag: "⚡ Escalates Conflict",
        responseOptions: ["maury_push", "maury_doubt"]
      }
    ]
  };

  const followUps = {
    marty_accept: {
      speaker: "Marty Welsh",
      text: "Building things is fine, Maury. But when your body fails, those structures don't hold your hand. The quality of your peace matters more than the height of your building."
    },
    marty_pushback: {
      speaker: "Marty Welsh",
      text: "That sounds like vanity talking. Life isn't a scorecard you present at the end."
    },
    marty_peace: {
      speaker: "Marty Welsh",
      text: "It becomes very simple. You stop planning ten years ahead and start valuing ten quiet minutes."
    },
    maury_push: {
      speaker: "Maury Ornest",
      text: "Easy to say, but without drive, human effort stalls out entirely! We need goals to move forward."
    },
    maury_doubt: {
      speaker: "Maury Ornest",
      text: "Maybe... but it is hard to unlearn a lifetime of measuring yourself by what you produce."
    }
  };

  function init() {
    document.getElementById("avatar-maury").style.backgroundImage = `url('${charImages.maury}')`;
    document.getElementById("avatar-marty").style.backgroundImage = `url('${charImages.marty}')`;
    renderTurnUI();
    updateProgressBar(0);
  }

  // Typewriter Animation Principle
  function typeWriterText(text, targetId, speed = 25) {
    if (typewriterTimeout) clearTimeout(typewriterTimeout);
    const elem = document.getElementById(targetId);
    elem.innerText = "";
    let i = 0;
    
    function type() {
      if (i < text.length) {
        elem.innerText += text.charAt(i);
        i++;
        typewriterTimeout = setTimeout(type, speed);
      }
    }
    type();
  }

  function renderTurnUI() {
    const isMaury = currentTurn === 'maury';
    
    // Toggle active speaker spotlight
    document.getElementById("card-maury").classList.toggle("active", isMaury);
    document.getElementById("card-marty").classList.toggle("active", !isMaury);

    // Update emotional badges
    const statusText = resolutionProgress < 50 ? "[Frustrated]" : resolutionProgress > 50 ? "[Empathetic]" : "[Calm]";
    document.getElementById("badge-maury").innerText = isMaury ? statusText : "[Waiting]";
    document.getElementById("badge-marty").innerText = !isMaury ? statusText : "[Waiting]";

    // Update banner text
    const banner = document.getElementById("instruction-banner");
    banner.innerText = `👇 Choose ${isMaury ? 'Maury' : 'Marty'}'s response`;
    banner.style.color = isMaury ? '#fbbf24' : '#60a5fa';
    banner.style.borderColor = isMaury ? 'rgba(245, 158, 11, 0.3)' : 'rgba(59, 130, 246, 0.3)';

    document.getElementById("choice-area-header").innerText = `Select ${isMaury ? 'Maury' : 'Marty'}'s Statement:`;

    // Render choice cards
    const choicesDiv = document.getElementById("choices");
    choicesDiv.innerHTML = "";

    dialogueTree[currentTurn].forEach((stance, index) => {
      const btn = document.createElement("button");
      btn.className = `choice-btn ${isMaury ? 'maury-btn' : 'marty-btn'}`;
      btn.style.animationDelay = `${index * 0.1}s`;
      btn.innerHTML = `
        <span>${stance.label}</span>
        <div style="display:flex; align-items:center;">
          <span class="choice-tag ${stance.type === 'calm' ? 'tag-calm' : 'tag-tense'}">${stance.tag}</span>
          <span class="btn-arrow">→</span>
        </div>`;
      btn.onclick = () => executeChoice(stance);
      choicesDiv.appendChild(btn);
    });
  }

  function executeChoice(stance) {
    const isMaury = currentTurn === 'maury';
    const speakerName = isMaury ? "Maury Ornest" : "Marty Welsh";

    const dialogueBox = document.getElementById("top-dialogue-box");
    const speakerTag = document.getElementById("speaker-tag");
    
    dialogueBox.className = isMaury ? 'maury-theme' : 'marty-theme';
    speakerTag.className = isMaury ? 'maury-text' : 'marty-text';
    speakerTag.innerText = speakerName;
    
    // Trigger Typewriter Animation
    typeWriterText(`"${stance.text}"`, "dialogue-text");

    // Spawn upward trajectory animation
    spawnFloatingCue(stance.progressDelta);
    updateProgressBar(stance.progressDelta);

    const choicesDiv = document.getElementById("choices");
    choicesDiv.innerHTML = "";

    if (checkEndings()) return;

    // Trigger counterpart reaction
    const nextCharKey = isMaury ? 'marty' : 'maury';
    const randomResponseKey = stance.responseOptions[Math.floor(Math.random() * stance.responseOptions.length)];
    const responseData = followUps[randomResponseKey];

    document.getElementById("instruction-banner").innerText = `⏳ ${responseData.speaker} is reacting...`;

    setTimeout(() => {
      const isNextMaury = nextCharKey === 'maury';
      
      dialogueBox.className = isNextMaury ? 'maury-theme' : 'marty-theme';
      speakerTag.className = isNextMaury ? 'maury-text' : 'marty-text';
      speakerTag.innerText = responseData.speaker;
      
      typeWriterText(`"${responseData.text}"`, "dialogue-text");

      if (!checkEndings()) {
        currentTurn = nextCharKey;
        renderTurnUI();
      }
    }, 1400);
  }

  function spawnFloatingCue(delta) {
    const cue = document.createElement("div");
    const isPositive = delta > 0;
    cue.className = `floating-cue ${isPositive ? 'cue-positive' : 'cue-negative'}`;
    cue.innerText = `${isPositive ? '+' : ''}${delta}% Resolution`;
    
    const container = document.getElementById("choices");
    container.appendChild(cue);

    setTimeout(() => cue.remove(), 1200);
  }

  function updateProgressBar(delta) {
    resolutionProgress = Math.max(0, Math.min(100, resolutionProgress + delta));
    
    const fill = document.getElementById("meter-fill");
    const statusLabel = document.getElementById("meter-status");
    
    fill.style.width = `${resolutionProgress}%`;
    statusLabel.innerText = `Progress: ${resolutionProgress}%`;

    // Color threshold logic
    if (resolutionProgress > 50) {
      fill.style.backgroundColor = "#10b981";
      statusLabel.style.color = "#34d399";
    } else if (resolutionProgress < 50) {
      fill.style.backgroundColor = "#ef4444";
      statusLabel.style.color = "#f87171";
    } else {
      fill.style.backgroundColor = "#f59e0b";
      statusLabel.style.color = "#fbbf24";
    }
  }

  function checkEndings() {
    const dialogueBox = document.getElementById("top-dialogue-box");
    const speakerTag = document.getElementById("speaker-tag");
    const resetBtn = document.getElementById("reset-btn");
    const banner = document.getElementById("instruction-banner");

    if (resolutionProgress <= 0) {
      speakerTag.className = "";
      speakerTag.innerText = "Debate Breakdown";
      typeWriterText("Progress dropped to 0%. Neither Maury nor Marty could find common ground, leaving the argument in a bitter stalemate.", "dialogue-text");
      dialogueBox.style.borderLeftColor = "#ef4444";
      banner.innerText = "🛑 Storyboard Ended: Conflict Unresolved";
      banner.style.color = "#f87171";
      document.getElementById("choices").innerHTML = "";
      resetBtn.style.display = "block";
      return true;
    } else if (resolutionProgress >= 100) {
      speakerTag.className = "";
      speakerTag.innerText = "Mutual Understanding";
      typeWriterText("Progress reached 100%! Maury acknowledged the value of presence, while Marty validated the passion behind building a legacy.", "dialogue-text");
      dialogueBox.style.borderLeftColor = "#10b981";
      banner.innerText = "✨ Storyboard Ended: Shared Resolution Reached";
      banner.style.color = "#34d399";
      document.getElementById("choices").innerHTML = "";
      resetBtn.style.display = "block";
      return true;
    }
    return false;
  }

  function resetGame() {
    resolutionProgress = 50;
    currentTurn = 'maury';
    
    const dialogueBox = document.getElementById("top-dialogue-box");
    dialogueBox.className = "maury-theme";

    const speakerTag = document.getElementById("speaker-tag");
    speakerTag.className = "maury-text";
    speakerTag.innerText = "Maury Ornest";

    typeWriterText("Choose how Maury initiates the argument on what gives life true purpose.", "dialogue-text");
    document.getElementById("instruction-banner").innerText = "👇 Choose Maury's response";
    document.getElementById("instruction-banner").style.color = "#fbbf24";
    
    document.getElementById("reset-btn").style.display = "none";
    
    renderTurnUI();
    updateProgressBar(0);
  }

  init();
</script>

</body>
</html>
